<h1 id="%EC%9D%B4%EC%A0%9C-ai%EA%B0%80-%EB%8B%A4-%ED%95%9C%EB%8B%A4%EB%8A%94%EB%8D%B0br%EC%99%9C-span-classaccent%EB%82%B4-%EC%8B%A4%EB%AC%B4%EB%8A%94-%EA%B7%B8%EB%8C%80%EB%A1%9Cspan%EC%9D%BC%EA%B9%8C">&quot;이제 AI가 다 한다&quot;는데,<br />왜 <span class="accent">내 실무는 그대로</span>일까?</h1>
<p>효율은 그닥, 시즌이 되면 여전히 야근 — 나만 겪는 게 아니라, 모두가 겪는 'AI-FOMO'</p>
<p class="accent">사실 이유는 단순합니다. 업무 자동화는, 생각보다 훨씬 더 어렵기 때문입니다.</p>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="comparison-vs" data-theme="procpa-vivid" lang="en-US" class="comparison-vs" data-marpit-pagination="5" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:comparison-vs;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EC%99%9C-%EC%97%85%EB%AC%B4-%EC%9E%90%EB%8F%99%ED%99%94%EB%8A%94-%EC%96%B4%EB%A0%A4%EC%9A%B8%EA%B9%8C">왜 업무 자동화는 어려울까?</h1>
<h2 id="%EC%97%85%EB%AC%B4%EC%9E%90%EB%8F%99%ED%99%94%EC%9D%98-%EB%91%90%EA%B0%80%EC%A7%80-%EB%B0%A9%EB%B2%95">업무자동화의 두가지 방법</h2>
<div class="vs-row">
<div class="vs-card">
<h3><span class="label">규칙</span>프로그래밍 기반 (Python·VBA)</h3>
<p>정해진 <strong>규칙대로만</strong> 철저하게 동작하는 <STRONG>결정론적</STRONG> 자동화</p>
<h4>한계</h4>
<ul>
<li><strong>예외 사항 적용의 어려움</strong> - 실제 실무는 매번 조건과 상황이 달라짐</li>
<li><strong>비표준 데이터에 활용 불가</strong> - 데이터가 표준화되어 있지 않으면 사용할 수 없음 </li>
</ul>
</div>
<div class="vs-divider"><span class="vs-badge">VS</span></div>
<div class="vs-card accented">
<h3><span class="label">추론</span>AI 기반 (Claude·Gemini·GPT)</h3>
<p><STRONG>확률 모델</STRONG>과 <STRONG>자연어</STRONG>를 바탕으로 유연하게 <STRONG>추론 및 판단</STRONG>하는 자동화</p>
<h4>한계</h4>
<ul>
<li><strong>불확정성이라는 고유 한계</strong> - 확률모델에 기반하여 결과가 매번 달라질 수 있음</li>
<li><strong>환각(Hallucination) 및 반복 취약성</strong> - 그럴듯한 오답을 생성하거나 반복 시 일관성이 낮음</li>
</ul>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="takeaway" data-theme="procpa-vivid" lang="en-US" class="takeaway" data-marpit-pagination="6" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:takeaway;--theme:procpa-vivid;" data-marpit-pagination-total="38"><div class="eyebrow">핵심 메시지</div>
<h1 id="%EA%B2%B0%EA%B5%AD-ai%EB%A5%BC-%EC%9E%98-%ED%99%9C%EC%9A%A9%ED%95%9C%EB%8B%A4%EB%8A%94-%EA%B2%83%EC%9D%80-strong%EB%B6%88%ED%99%95%EC%A0%95%EC%84%B1strong%EC%9D%84-%EC%9E%98-%EB%8B%A4%EB%A3%A8%EB%8A%94-%EA%B2%83">결국 AI를 잘 활용한다는 것은 <strong>불확정성</strong>을 잘 다루는 것</h1>
<p>AI의 한계와 확률적 특성을 인정하고, 이를 통제하기 위한 명확한 규칙과 자가 검증 구조를 설계하는 것이 성공적인 자동화의 열쇠입니다.</p>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="feature-cards" data-theme="procpa-vivid" lang="en-US" class="feature-cards" data-marpit-pagination="7" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:feature-cards;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="ai%EB%A5%BC-%ED%9A%A8%EA%B3%BC%EC%A0%81%EC%9C%BC%EB%A1%9C-%ED%99%9C%EC%9A%A9%ED%95%98%EA%B8%B0-%EC%9C%84%ED%95%9C-3%EA%B0%80%EC%A7%80-%EC%A0%84%EB%9E%B5">AI를 효과적으로 활용하기 위한 3가지 전략</h1>
<div class="cards">
<div class="card">
<h4>전략 1 · Rule-base</h4>
<h3>결정론적 영역 확대</h3>
<p>뼈대(80~90%)는 규칙 기반으로 채우고 <strong>판단 및 추론이 필요한 분야</strong>에만 AI를 활용. 일관성 확보와 토큰 비용 절약의 기초.</p>
</div>
<div class="card">
<h4>전략 2 · Self-Verify</h4>
<h3>자가 검증 루프 설계</h3>
<p>하네스/루프 엔지니어링 기반. 감사인처럼 <strong>독립된 에이전트가 결과물을 교차검증</strong>하는 시스템을 구축.</p>
</div>
<div class="card">
<h4>전략 3 · Simplicity</h4>
<h3>작은 것부터, 사용편의성</h3>
<p>아주 <strong>작은 단위</strong>부터 자동화를 시작하는 것이 중요하며, <strong>쉽고 단순</strong>해야 지속적으로 사용할 수 있음(VLOOKUP이 강력한 이유).</p>
</div>
</div>
<div class="callout">
<strong>클로드 엑셀 소개에 앞서</strong>
<p>1. 클로드 엑셀은 사용하기 쉽고 강력하지만, 확률 모델에 기반하므로 <strong>본질적인 불확정성의 한계</strong>를 가집니다.</p>
<p>2. 결과물이 완벽하지 않을 수 있으므로, 최종 수식과 데이터에 대한 <strong>검증 및 검토</strong>가 필수적입니다.</p>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="section" data-theme="procpa-vivid" lang="en-US" class="section" data-marpit-pagination="8" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:section;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="02">02</h1>
<h2 id="%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%97%91%EC%85%80-%EA%B8%B0%EB%B3%B8">클로드 엑셀 기본</h2>
<footer>한국공인회계사회 AI 활용 간담회</footer>

<h1 id="%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%97%91%EC%85%80-%EC%86%8C%EA%B0%9C">클로드 엑셀 소개</h1>
<div class="cols">
<div>
<p>VBA/Python 코딩 없이, 동료에게 업무를 부탁하듯 <strong>자연어로 지시하여 엑셀을 제어</strong>하는 앤트로픽의 공식 애드인입니다.</p>
<ul>
<li><strong>유료 플랜 지원</strong>: Pro, Max, Team, Enterprise 요금제</li>
<li><strong>지원 환경</strong>: 웹용 엑셀, Windows용(M365), Mac, iPad</li>
</ul>
</div>
<div>
<img src="assets/intro-excel.png" class="shot" />
</div>
</div>

<h1 id="%EC%84%A4%EC%B9%98-%EB%B0%A9%EB%B2%95">설치 방법</h1>
<div class="cols">
<div>
<img src="assets/install.png" class="shot" />
</div>
<div>
<p>엑셀 추가기능(Add-in)을 통해 별도의 프로그램 설치 없이 등록할 수 있습니다.</p>
<ol>
<li><strong>추가기능 검색</strong>: 엑셀 상단 <code>홈</code> → <code>추가기능</code> 메뉴에서 <code>claude</code>를 검색하여 <strong>Claude by Anthropic for Excel</strong>을 추가합니다.</li>
<li><strong>리본 메뉴 활성화</strong>: 설치 후 홈 리본 메뉴 우측의 Claude 아이콘을 클릭하고 안내에 따라 로그인하여 활성화합니다.</li>
</ol>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="split" data-theme="procpa-vivid" lang="en-US" class="split" data-marpit-pagination="11" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:split;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EA%B8%B0%EB%B3%B8-%EC%84%A4%EC%A0%95">기본 설정</h1>
<div class="cols">
<div>
<img src="assets/settings.png" class="shot" />
</div>
<div>
<p>톱니바퀴 아이콘(Settings)에서 다음을 설정합니다.</p>
<ul>
<li><strong>Instructions</strong>: 모든 세션에 스타일 가이드 고정</li>
<li><strong>Suggest improvements</strong>: 클로드가 알아서 대안을 추천 (활성화 권장)</li>
<li><strong>Session logging</strong>: 세션 수행 시마다 로그 기록 (활성화 권장)</li>
<li><strong>Switch models</strong>: 민감 정보 감지 시 자동 모델 변경 (활성화 권장)</li>
<li><strong>Work across files</strong>: 다른 엑셀/워드/PPT 파일 접근 허용 (활성화 권장)</li>
</ul>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="content-sidebar" data-theme="procpa-vivid" lang="en-US" class="content-sidebar" data-marpit-pagination="12" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:content-sidebar;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%9C%A0%EC%B6%9C-%EB%B0%A9%EC%A7%80%EB%A5%BC-%EC%9C%84%ED%95%9C-%EB%B3%B4%EC%95%88-%EC%84%A4%EC%A0%95">데이터 유출 방지를 위한 보안 설정</h1>
<div class="layout">
<div class="main">
<ul>
<li><strong>1) 학습 거부 설정</strong> — <code>설정 → 개인정보보호 → Claude 개선에 도움 주기</code> 해제 (가장 기본)</li>
<li><strong>2) 템플릿만 업로드</strong> — 실제 값 없이 양식·머리글만 제공해 유출을 원천 차단 (다만 실무에선 비현실적)</li>
<li><strong>3) 데이터 마스킹</strong> — 가장 현실적이고 강력한 전략
<ul>
<li><strong>고유명사</strong>(거래처·이름): 매핑 테이블로 치환 후 분석 → 결과 복원</li>
<li><strong>기밀 수치</strong>: 노이즈(임의 배수 곱·상수 가감)로 왜곡, 비율·추세만 분석</li>
</ul>
</li>
</ul>
<p><span class="note">기술적 방안일 뿐 법률적 안전을 보장하지 않음 — 조직 보안 내규 사전 검토 필수</span></p>
</div>
<div class="aside">
<h4 id="%EC%99%9C-%EB%B3%B4%EC%95%88%EC%9D%B4-%EC%B5%9C%EC%9A%B0%EC%84%A0%EC%9D%B8%EA%B0%80">왜 보안이 최우선인가</h4>
<p>재무·미공시 데이터, 급여·고객 정보는 <strong>영업비밀이자 개인정보</strong> — 유출 시 부정경쟁방지법·개인정보보호법·자본시장법 리스크.</p>
<h4 id="%EA%B0%80%EC%9E%A5-%EA%B6%8C%EC%9E%A5%EB%90%98%EB%8A%94-%EB%B0%A9%EC%8B%9D">가장 권장되는 방식</h4>
<p><strong>Team / Enterprise · API</strong> = 상업용 약관(<strong>모델 학습 미활용</strong>). 민감 데이터는 원칙적으로 AI 활용 지양.</p>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="icon-list compact" data-theme="procpa-vivid" lang="en-US" class="icon-list compact" data-marpit-pagination="13" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:icon-list compact;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EC%A3%BC%EC%9A%94-%EA%B8%B0%EB%8A%A5">주요 기능</h1>
<ul>
<li><em>분석</em> <strong>데이터 구조 분석</strong> 여러 탭과 시트의 연결 구조 및 데이터 흐름을 빠르게 파악하고 요약</li>
<li><em>편집</em> <strong>파일 편집</strong> 수식 입력, 조건부 서식/피벗 생성, 발생한 계산 오류 추적 및 수정</li>
<li><em>지침</em> <strong>지침(Instructions) 설정</strong> — 전역 스타일 가이드(서식 규칙, 셀 하이라이트 색상 등) 일관 적용</li>
<li><em>연동</em> <strong>커넥터(MCP) 지원</strong> MCP 커넥터를 활용해 외부 데이터를 실시간 연동</li>
<li><em>자동</em> <strong>스킬(Skills) 지원</strong> 고도의 반복·전문 작업을 스킬로 패키징하여 즉시 실행</li>
<li><em>추출</em> <strong>외부 파일 읽기</strong> 첨부된 PDF, Word, CSV, JSON, XML 문서를 직접 읽어 엑셀 표로 깔끔하게 변환</li>
</ul>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="comparison-vs" data-theme="procpa-vivid" lang="en-US" class="comparison-vs" data-marpit-pagination="14" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:comparison-vs;--theme:procpa-vivid;" data-marpit-pagination-total="38"><div class="eyebrow">동작 원리 비교</div>
<h1 id="%EC%9E%91%EB%8F%99-%EB%A9%94%EC%BB%A4%EB%8B%88%EC%A6%98-%EB%82%B4%EB%B6%80-%EC%A0%9C%EC%96%B4officejs">작동 메커니즘: 내부 제어(Office.js)</h1>
<div class="vs-row">
<div class="vs-card">
<h3><span class="label">Claude Code, CODEX 등</span>Python 기반 외부 제어</h3>
<p>외부 개발환경에서 라이브러리(openpyxl, pandas)를 사용해 파일을 조작합니다.</p>
<ul>
<li><strong>정적 파일 대상</strong>: 디스크에 저장된 엑셀 파일을 읽고 씀</li>
<li><strong>수식 실행 불가</strong>: 수식 텍스트 자체만 읽거나 작성 가능 (실제 계산 불가능)</li>
<li><strong>대량 처리 유리</strong>: 외부 서버에서 일괄 배치 처리 가능</li>
</ul>
</div>
<div class="vs-divider"><span class="vs-badge">VS</span></div>
<div class="vs-card accented">
<h3><span class="label">Claude for Excel</span>Office.js 기반 내부 제어</h3>
<p class="accent">엑셀 내부 브라우저 WebView 환경에서 Microsoft 공식 API를 활용하여 직접 조작합니다.</p>
<ul>
<li><strong>실시간 제어</strong>: 현재 화면에 열린 문서를 직접 조작하고 눈앞에서 즉시 반영</li>
<li><strong>실제 수식 연산</strong>: 수식 계산은 엑셀의 계산 엔진이 실시간으로 수행</li>
<li><strong>상태 추론</strong>: 선택 영역, 시트 변경 상태 등을 즉시 파악 및 대응</li>
</ul>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="steps" data-theme="procpa-vivid" lang="en-US" class="steps" data-marpit-pagination="15" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:steps;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8-%EC%9E%91%EB%8F%99-%EC%88%9C%EC%84%9C-%EC%9E%90%EA%B8%B0-%EC%A0%90%EA%B2%80%EA%B3%BC-%EC%88%98%EC%A0%95-%EB%A3%A8%ED%94%84">에이전트 작동 순서: 자기 점검과 수정 루프</h1>
<ol>
<li><strong>문서 상태 파악</strong> Office.js를 통해 시트 구성, 데이터 범위, 수식, 서식 등 현재 워크북 상태 분석</li>
<li><strong>작업 계획 수립</strong> 파악된 문서 상태와 지시를 바탕으로 수행할 작업 절차 설계</li>
<li><strong>코드 생성 및 실행</strong> 필요한 코드를 즉석에서 생성하여 엑셀 샌드박스 또는 컨테이너에서 실행</li>
<li><strong>결과 확인 및 검증</strong> 변경된 셀 상태 및 계산 오류 발생 여부 검사</li>
<li><strong>자가 수정 루프</strong> 오류 발견 시 코드를 스스로 수정하고 재실행하여 완성도 높은 결과 도출</li>
</ol>

<h2 id="%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%97%91%EC%85%80-%EC%82%AC%EC%9A%A9%EB%B2%95">클로드 엑셀 사용법</h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="feature-cards" data-theme="procpa-vivid" lang="en-US" class="feature-cards" data-marpit-pagination="17" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:feature-cards;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%ED%94%84%EB%A1%AC%ED%94%84%ED%8A%B8-%EC%9E%91%EC%84%B1-%ED%8C%81">프롬프트 작성 팁</h1>
<p>클로드엑셀의 프롬프트 작성법은 일반적인 AI 챗봇을 다룰 때의 '프롬프트 엔지니어링' 원칙과 다르지 않습니다.</p>
<div class="cards">
<div class="card">
<h4>원칙 1</h4>
<h3>구체적인 작업 명시</h3>
<p>모호한 지시 대신 <strong>명확한 시트 이름, 셀 범위, 결과 형태</strong>를 명시. 작업 범위를 마우스로 선택한 후 지시하면 더욱 정확함.</p>
</div>
<div class="card">
<h4>원칙 2</h4>
<h3>AI 역프롬프팅</h3>
<p>함수나 기능이 무엇인지 모를 땐 <strong>먼저 방법을 질문</strong>. "방금 알려준 방식으로 작업 가능한 프롬프트를 짜줘"라고 역요청 가능.</p>
</div>
<div class="card">
<h4>원칙 3</h4>
<h3>단계별 실행</h3>
<p>복잡한 작업은 한 번에 지시하지 말고 <strong>"실행 계획을 먼저 세워줘"</strong>라고 한 뒤, 단계별(Step-by-Step)로 나누어 실행.</p>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="split" data-theme="procpa-vivid" lang="en-US" class="split" data-marpit-pagination="18" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:split;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EA%B8%B0%EB%B3%B8-%ED%99%9C%EC%9A%A9-%EC%82%AC%EB%A1%80-1--%EA%B3%84%EC%A0%95%EB%B3%84%EC%9B%90%EC%9E%A5-%ED%86%B5%ED%95%A9-1">기본 활용 사례 1 : 계정별원장 통합 (1)</h1>
<div class="cols">
<div>
<h2 id="1-%EC%83%81%ED%99%A9">(1) 상황</h2>
<p>더존에서 내려받은 일반적인 형태의 계정별 원장으로, 다음의 <strong>두 가지 구조적 문제</strong>가 있어 직접 분석하거나 시산표를 만들기 어렵습니다.</p>
<ul>
<li><strong>시트 분할</strong>: 계정과목별로 시트가 나뉘어 있어 전체 통합 분석이 불가능</li>
<li><strong>열(Column) 누락</strong>: 각 행에 계정과목 정보가 없어 필터링이나 집계 불가</li>
</ul>
</div>
<div>
<img src="assets/ledger-1.png" class="shot" />
</div>
</div>

<h1 id="%EC%8A%A4%ED%82%AC-skills---1-%EA%B0%9C%EB%85%90-%EB%B0%8F-%EC%9E%91%EB%8F%99%EC%9B%90%EB%A6%AC">스킬 (Skills) - (1) 개념 및 작동원리</h1>
<div class="layout">
<div class="main">
<h2 id="%EC%8A%A4%ED%82%AC%EC%9D%B4%EB%9E%80">스킬이란?</h2>
<p>AI 에이전트에게 <strong>업무 지식, 실행 방법, 템플릿</strong>을 하나로 묶어 제공하는 <strong>전문 지식 패키지</strong>입니다. 클로드가 특정 실무를 수행할 수 있도록 마치 전문가의 인수인계 매뉴얼처럼 만들어 주는 기능입니다.</p>
<br />
<h2 id="%EC%9E%91%EB%8F%99-%EC%9B%90%EB%A6%AC-%EC%A0%90%EC%A7%84%EC%A0%81-%EA%B3%B5%EA%B0%9C">작동 원리 (점진적 공개)</h2>
<ol>
<li><strong>탐색</strong>: 지시 내용 분석 후 필요한 스킬 목록 식별</li>
<li><strong>활성화</strong>: 해당 스킬 지침서(<code>SKILL.md</code>)를 메모리에 로드</li>
<li><strong>실행</strong>: 지침에 따라 엑셀 수식·서식을 일관되게 생성</li>
</ol>
</div>
<div class="aside">
<h4 id="%EC%8A%A4%ED%82%AC-%ED%8F%B4%EB%8D%94-%EA%B5%AC%EC%A1%B0">스킬 폴더 구조</h4>
<ul>
<li><strong><code>SKILL.md</code> (필수)</strong>: 작동 지침서</li>
<li><strong><code>resources/</code></strong>: 표준 템플릿, 참조 데이터</li>
<li><strong><code>examples/</code></strong>: 모범 결과 샘플</li>
<li><strong><code>scripts/</code></strong>: 반복 작업용 스크립트</li>
</ul>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>

<h1 id="%EC%8A%A4%ED%82%ACskills---3-%EC%8A%A4%ED%82%AC-%EC%83%9D%EC%84%B1-%EB%B0%8F-%EB%93%B1%EB%A1%9D">스킬(Skills) - (3) 스킬 생성 및 등록</h1>
<div class="cols">
<div>
<h2 id="%EC%8A%A4%ED%82%AC-%EC%83%9D%EC%84%B1">스킬 생성</h2>
<ul>
<li><strong>방법 1</strong> — <code>/skill-creator</code> 슬래시 명령어 입력 후 원하는 스킬 내용을 대화로 설명</li>
<li><strong>방법 2</strong> — 기존 작업 세션에서 <code>/skillify</code> 슬래시 명령어 입력 → 시행착오 컨텍스트가 반영돼 완성도가 높음</li>
</ul>
<br />
<br />
<br />
<br />
<br />
</div>
<div>
<h2 id="%EB%93%B1%EB%A1%9D-%EC%A0%88%EC%B0%A8-3%EB%8B%A8%EA%B3%84">등록 절차 (3단계)</h2>
<ol>
<li><strong>Claude.ai 접속</strong>: 프로필 → <code>사용자 지정</code> → <code>스킬</code> → <code>+</code> → <code>스킬 지침 작성</code></li>
<li><strong>붙여넣기 후 저장</strong>: 복사한 스킬 텍스트를 붙여넣고 <code>만들기</code> 클릭</li>
<li><strong>클로드 엑셀 즉시 연동</strong>: 엑셀로 돌아오면 바로 사용 가능</li>
</ol>
<div class="callout warn"><strong>⚠️ 주의</strong>: 클로드 엑셀은 로컬 스킬을 지원하지 않습니다. PC 폴더에 저장한 스킬은 인식 불가 — <strong>Claude.ai 클라우드 계정에 등록된 커스텀 스킬만</strong> 사용 가능합니다.</div>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="content-sidebar" data-theme="procpa-vivid" lang="en-US" class="content-sidebar" data-marpit-pagination="29" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:content-sidebar;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="%EC%BB%A4%EB%84%A5%ED%84%B0-mcp-%EC%8B%A4%EC%8B%9C%EA%B0%84-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%97%B0%EB%8F%99">커넥터 (MCP): 실시간 데이터 연동</h1>
<div class="layout">
<div class="main">
<h2 id="mcp-model-context-protocol%EB%9E%80">MCP (Model Context Protocol)란?</h2>
<p>AI가 외부 서비스·데이터베이스와 통신할 수 있도록 연결 방식을 하나로 통일한 <strong>개방형 표준 프로토콜</strong>입니다. 각 서비스마다 다른 API 규격을 AI가 공통 언어로 연결할 수 있게 해주는 <strong>범용 어댑터</strong>라고 이해하면 됩니다.</p>
<br />
<h2 id="%ED%81%B4%EB%A1%9C%EB%93%9C-%EC%97%91%EC%85%80%EC%97%90%EC%84%9C-%EC%82%AC%EC%9A%A9-%EA%B0%80%EB%8A%A5%ED%95%9C-%EC%BB%A4%EB%84%A5%ED%84%B0">클로드 엑셀에서 사용 가능한 커넥터</h2>
<table>
<thead>
<tr>
<th>종류</th>
<th>설명</th>
<th style="text-align:center">지원</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>공식 커넥터</strong></td>
<td>Gmail, Google Calendar, Notion 등 앤트로픽 공식 인증 서비스</td>
<td style="text-align:center">✓</td>
</tr>
<tr>
<td><strong>커스텀 커넥터</strong></td>
<td>직접 만든 MCP 서버 URL 등록 (예: Open DART API)</td>
<td style="text-align:center">✓</td>
</tr>
<tr>
<td><strong>데스크톱 확장</strong></td>
<td>PC 로컬 파일 기반 연동 (클로드 데스크톱 전용)</td>
<td style="text-align:center">✕</td>
</tr>
</tbody>
</table>
</div>
<div class="aside">
<h4 id="%ED%99%9C%EC%9A%A9-%EC%82%AC%EB%A1%80">활용 사례</h4>
<ul>
<li><strong>구글 캘린더</strong> → 내 일정을 엑셀 표로 자동 정리</li>
<li><strong>Notion</strong> → 노션 데이터베이스를 엑셀에 동기화</li>
<li><strong>Open DART</strong> → 공시 데이터를 실시간으로 가져와 재무 분석 (4장 실전 사례에서 활용)</li>
</ul>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>

<h1 id="04">04</h1>
<h2 id="%EC%8B%A4%EC%A0%84--dcf-%ED%8F%89%EA%B0%80-%EC%8B%9C%EC%97%B0">실전 — DCF 평가 시연</h2>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="content-sidebar" data-theme="procpa-vivid" lang="en-US" class="content-sidebar" data-marpit-pagination="31" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:content-sidebar;--theme:procpa-vivid;" data-marpit-pagination-total="38">
<h1 id="dcf-%ED%8F%89%EA%B0%80-%EC%8B%9C%EC%97%B0-%EB%B2%94%EC%9C%84">DCF 평가 시연 범위</h1>
<div class="layout">
<div class="main">
<p><strong>1. 유사기업 선정 및 데이터 수집</strong> <span style="font-size:0.75em; color:var(--text-muted,#888)">(MCP 서버 활용)</span></p>
<ul>
<li>업종 내 상장사 목록 조회 → 평가 대상과 유사한 기업 선별</li>
<li><code>peer-group-search</code> MCP 서버로 β·이자부부채·시가총액을 <strong>자동 수집</strong></li>
</ul>
<br />
<p><strong>2. DCF 템플릿 작성</strong> <span style="font-size:0.75em; color:var(--text-muted,#888)">(Input Data → Skill → DCF Model)</span></p>
<ul>
<li>Input data 시트를 기반으로 Skill을 활용하여 DCF 템플릿 <strong>자동 완성</strong></li>
</ul>
<p style="font-size: 0.75em; color: var(--text-muted, #888); margin-top: 12px;">※ 실제 작업은 엑셀을 켜서 라이브로 진행합니다.</p>
</div>
<div class="aside">
<h4 id="dcf-%ED%8F%89%EA%B0%80-4%EB%8B%A8%EA%B3%84">DCF 평가 4단계</h4>
<ol>
<li><strong>기초데이터 수집</strong> — 평가대상회사 재무 + 외부데이터(유사기업 등)</li>
<li><strong>평가가정 설정</strong> — 성장률·할인율 등 핵심 가정 확정</li>
<li><strong>모델링 (평가 템플릿 작성)</strong> — 매출·WACC·FCFF·DCF 시트 구축</li>
<li><strong>모델 리뷰 및 검증</strong> — 정합성·계산 오류 교차 점검</li>
</ol>
</div>
</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="feature-cards" data-theme="procpa-vivid" lang="en-US" class="feature-cards" data-marpit-pagination="32" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:feature-cards;--theme:procpa-vivid;" data-marpit-pagination-total="38"><div class="eyebrow">LIVE 시연 1</div>
<h1 id="%EC%9C%A0%EC%82%AC%EA%B8%B0%EC%97%85-%EC%84%A0%EC%A0%95-%EB%B0%8F-%EB%8D%B0%EC%9D%B4%ED%84%B0-%EC%88%98%EC%A7%91">유사기업 선정 및 데이터 수집</h1>
<p>핵심은 <strong>MCP 서버로 외부 데이터를 직접 가져와</strong> DCF에 곧바로 활용한다는 점입니다. 수십 개 상장사의 데이터를 일일이 조회하던 작업을 프롬프트 한 번으로 자동화합니다.</p>
<div class="cards">
<div class="card">
<h4>OpenDART</h4>
<h3>재무·공시 데이터</h3>
<p>이자부부채(IBD), 재무제표 등을 XBRL에서 정밀 파싱해 자동 추출.</p>
</div>
<div class="card">
<h4>네이버 금융</h4>
<h3>시가총액·주가</h3>
<p>평가기준일 시가총액·주가를 실시간으로 조회.</p>
</div>
<div class="card">
<h4>한국공인회계사회</h4>
<h3>β (베타) 조회</h3>
<p>베타 조회 서비스를 직접 연동해 수집</p>
</div>
</div>
<div class="callout">반복 수작업(데이터 조회)은 MCP가, <strong>Peer 선정 판단</strong>은 사람이.</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="한국공인회계사회 AI 활용 간담회" data-class="feature-cards" data-theme="procpa-vivid" lang="en-US" class="feature-cards" data-marpit-pagination="33" style="--paginate:true;--footer:한국공인회계사회 AI 활용 간담회;--class:feature-cards;--theme:procpa-vivid;" data-marpit-pagination-total="38"><div class="eyebrow">LIVE 시연 2</div>
<h1 id="dcf-%ED%85%9C%ED%94%8C%EB%A6%BF-%EC%99%84%EC%84%B1-%EB%A7%A4%EC%B6%9C--wacc-%EC%8B%9C%ED%8A%B8">DCF 템플릿 완성 (매출 · WACC 시트)</h1>
<p>핵심은 <strong>스킬(Skill)로 반복적이고 고도화된 작업을 자동화</strong>하는 것입니다. 템플릿을 채우는 방법·평가로직·스타일 가이드를 스킬에 명시해두면, 클로드 엑셀이 매번 일관된 품질로 시트를 완성합니다.</p>
<div class="cards">
<div class="card">
<h4>① 채우는 방법</h4>
<h3>템플릿 작성 절차</h3>
<p>어떤 시트를 어떤 순서로, 어떤 셀에 무엇을 넣는지 단계별로 명시.</p>
</div>
<div class="card">
<h4>② 모델링 로직</h4>
<h3>계산 규칙</h3>
<p>매출 추정(사업계획→거시지표), WACC 산식 등 도메인 로직을 코드처럼 고정.</p>
</div>
<div class="card">
<h4>③ 스타일 가이드</h4>
<h3>서식 일관성</h3>
<p>입력값(파랑)·참조값(초록)·수식(검정) 색상과 숫자 서식까지 자동 통일.</p>
</div>
</div>
<div class="callout success"><strong>포인트</strong> — 매번 설명하지 않아도 스킬 하나로 <strong>반복·고도화 작업을 일관되게 자동화</strong>.</div>
<footer>한국공인회계사회 AI 활용 간담회</footer>
</section>

<div class="vs-row">
<div class="vs-card">

<h4>이럴 때 선택</h4>
<ul>
<li>열려있는 파일을 즉석에서 고치거나 채울 때</li>
<li>가정을 바꿔보며 결과를 실시간으로 확인 할 때</li>
<li>차트·피벗·조건부 서식 등의 기능을 직접 제어할 때</li>
<li>한 번 쓰고 끝나는 분석</li>
</ul>

<div class="vs-card">
<h3><span class="label">반복 · 자동화</span>Claude Code, Codex</h3>
<p>AI가 만든 <strong>코드를 저장해서 도구로 사용</strong> </p>
<h4>이럴 때 선택</h4>
<ul>
<li>매월·매분기 반복되는 결산 포맷팅 등</li>
<li>한 번 만든 로직을 계속 재사용할 때</li>
<li>수천 행 이상의 대량 데이터를 한꺼번에 처리할 때</li>
<li>여러 파일을 일괄로 처리할 때</li>
</ul>
</div>
</div>
