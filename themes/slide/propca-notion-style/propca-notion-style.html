<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-1--%ED%85%8D%EC%8A%A4%ED%8A%B8-%EA%B0%95%EC%A1%B0--%EC%9D%B8%EB%9D%BC%EC%9D%B8-%EC%BD%94%EB%93%9C">공통 요소 1 — 텍스트 강조 &amp; 인라인 코드</h1>
<p>기본 슬라이드 폰트는 Notion 고유의 친근한 <strong>Rounded Sans</strong> 기반의 Pretendard 및 Noto Sans KR을 탑재하고 있습니다.</p>
<ul>
<li><strong>굵은 글씨</strong>는 테마의 시그니처 보라색 <code>#5645d4</code>로 자동 강조 표시됩니다.</li>
<li><em>이태릭체</em> 문법은 노란색 인라인 배지 태그로 자동 치환 및 렌더링됩니다.</li>
<li>인라인 <code>`code`</code> 문법은 연한 보라색 배경에 보라색 텍스트로 표기됩니다.</li>
<li>본문 텍스트는 <strong>17pt</strong> 크기로 가독성이 우수합니다.</li>
</ul>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="01. 공통 지원 컴포넌트" data-footer="© 2026 · procpa" data-theme="propca-notion-style" lang="ko-KR" data-marpit-pagination="5" style="--paginate:true;--header:01. 공통 지원 컴포넌트;--footer:© 2026 · procpa;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-2--%EB%A6%AC%EC%8A%A4%ED%8A%B8-%EB%AC%B8%EB%B2%95--%EB%B8%94%EB%A1%9D-%EC%9D%B8%EC%9A%A9%EA%B5%AC">공통 요소 2 — 리스트 문법 &amp; 블록 인용구</h1>
<p>마크다운의 기본 문법을 통해 리스트 구조와 중요 구절을 효과적으로 배치할 수 있습니다.</p>
<ul>
<li>글머리 기호(Unordered List) 마커는 보라색으로 강조됩니다.
<ul>
<li>서브 리스트 항목 역시 들여쓰기가 깔끔하게 맞춰집니다.</li>
</ul>
</li>
</ul>
<ol>
<li>숫자 리스트(Ordered List)를 사용하여 순차적인 단계나 순위를 명확하게 보여줄 수 있습니다.</li>
</ol>
<ul>
<li>블록 인용구(<code>blockquote</code>)는 다음과 같이 렌더링됩니다.</li>
</ul>
<blockquote>
<p>Notion 테마는 단순한 문서 작성을 넘어, 팀의 지식이 자연스럽게 흐르는 공간을 지향합니다.</p>
</blockquote>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="01. 공통 지원 컴포넌트" data-footer="© 2026 · procpa" data-theme="propca-notion-style" lang="ko-KR" data-marpit-pagination="6" style="--paginate:true;--header:01. 공통 지원 컴포넌트;--footer:© 2026 · procpa;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-3--%ED%85%8C%EC%9D%B4%EB%B8%94-table">공통 요소 3 — 테이블 (Table)</h1>
<p>마크다운 기본 테이블 표기법을 통해 정보를 일목요연한 행/열 구조로 표현할 수 있습니다.</p>
<table>

<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-4--%EC%BD%94%EB%93%9C-%EB%B8%94%EB%A1%9D-code-block">공통 요소 4 — 코드 블록 (Code Block)</h1>
<p>기본 <code>pre</code> 및 <code>code</code> 블록에는 GitHub Light 테마의 배경/테두리 색상과 구문 강조(Syntax Highlighting) 기능이 자동으로 탑재되어 가독성이 뛰어납니다.</p>
<pre><code class="language-python"><span class="hljs-comment"># 1. 환영 메시지 출력 함수 정의</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">greet_user</span>(<span class="hljs-params">name: <span class="hljs-built_in">str</span></span>) -&gt; <span class="hljs-built_in">str</span>:
    <span class="hljs-string">&quot;&quot;&quot;사용자에게 노션 테마 환영 인사 반환&quot;&quot;&quot;</span>
    message = <span class="hljs-string">f&quot;Welcome, <span class="hljs-subst">{name}</span>! Let&#x27;s build slides.&quot;</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;[INFO] Greeting has been generated.&quot;</span>)
    <span class="hljs-keyword">return</span> message

<span class="hljs-comment"># 2. 함수 실행 예시</span>
greeting = greet_user(<span class="hljs-string">&quot;Antigravity&quot;</span>)
</code></pre>

<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-5--%EC%BD%9C%EC%95%84%EC%9B%83-5%EC%A2%85">공통 요소 5 — 콜아웃 5종</h1>
<p>정보의 중요도나 종류에 따라 알맞은 콜아웃을 자유롭게 활용할 수 있습니다.</p>
<div class="callout info">
<p><strong>INFO</strong> 알아두면 좋은 정보. 본문 내용 외의 부가적인 배경 설명이나 팁을 제공합니다.</p>
</div>
<div class="callout success">
<p><strong>TIP</strong> 성공 사례나 권장 사항. 권장 체크리스트나 핵심 조언을 강조합니다.</p>
</div>
<div class="callout example">
<p><strong>EXAMPLE</strong> 사례·시나리오 예시. 추상적 개념을 구체적인 케이스로 보충합니다.</p>
</div>
<div class="callout warn">
<p><strong>WARNING</strong> 주의 사항. 잘못된 설정이나 실수로 결과가 비틀어질 수 있는 상황을 방지합니다.</p>
</div>
<div class="callout danger">
<p><strong>DANGER</strong> 경고 및 가이드. 되돌릴 수 없는 데이터 손실이나 중요 작업 시 필독을 요구합니다.</p>
</div>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="01. 공통 지원 컴포넌트" data-footer="© 2026 · procpa" data-theme="propca-notion-style" lang="ko-KR" data-marpit-pagination="9" style="--paginate:true;--header:01. 공통 지원 컴포넌트;--footer:© 2026 · procpa;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-6--%EC%9D%B8%EB%9D%BC%EC%9D%B8-%ED%83%9C%EA%B7%B8-tag">공통 요소 6 — 인라인 태그 <code>.tag</code></h1>
<p><code>&lt;span class=&quot;tag green|yellow|purple|rose|sky|peach|navy&quot;&gt;</code>로 상태·라벨 배지를 어디서나 표현합니다.</p>
<ul>
<li>진행 상태 예시: <span class="tag green">완료</span> <span class="tag yellow">진행 중</span> <span class="tag sky">검토 중</span> <span class="tag rose">P0</span> <span class="tag purple">P1</span></li>
<li>부서·태그 예시: <span class="tag peach">감사 1팀</span> <span class="tag navy">기밀</span> <span class="tag purple">2026.Q1</span></li>
<li>본문 안에서 <span class="tag green">통과</span> 또는 <span class="tag rose">미흡</span> 처럼 흐름에 자연스럽게 삽입할 수 있습니다.</li>
<li>7가지 색상은 모두 노션 파스텔 펠릿(<code>--pastel-*</code>)에 매핑되어 톤이 일관됩니다.</li>
</ul>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="01. 공통 지원 컴포넌트" data-footer="© 2026 · procpa" data-theme="propca-notion-style" lang="ko-KR" data-marpit-pagination="10" style="--paginate:true;--header:01. 공통 지원 컴포넌트;--footer:© 2026 · procpa;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>01. 공통 지원 컴포넌트</header>
<h1 id="%EA%B3%B5%ED%86%B5-%EC%9A%94%EC%86%8C-7--%EC%B9%A9-chip--%ED%82%A4%EB%B3%B4%EB%93%9C-kbd">공통 요소 7 — 칩 <code>.chip</code> &amp; 키보드 <code>.kbd</code></h1>
<p>**칩(.chip)**은 태그보다 더 작은 풀필(pill) 라벨, **키보드(.kbd)**는 단축키 표기에 사용합니다.</p>
<ul>
<li>칩 기본형: <span class="chip">베타</span> <span class="chip">Q1</span> <span class="chip">Audit</span></li>
<li>칩 강조형: <span class="chip solid">NEW</span> <span class="chip outline">DRAFT</span></li>
<li>키보드 단축키: <span class="kbd">⌘</span>+<span class="kbd">K</span> 로 빠른 검색, <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">P</span> 로 명령 팔레트</li>
<li>본문 중간에 자연스럽게 삽입 가능: 자료 저장은 <span class="kbd">⌘</span>+<span class="kbd">S</span>, 슬라이드 추가는 <span class="kbd">Enter</span>.</li>
</ul>
<footer>© 2026 · procpa</footer>
</section>

<p>슬라이드 내부에서 가벼운 구분선과 보조 메모를 표시할 때 사용합니다.</p>

<p>전용 split·grid 레이아웃 없이도 본문 일부만 2단·3단 분할이 가능합니다.</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="02. 전용 레이아웃 — 콘텐츠 분할" data-footer="© 2026 · procpa" data-class="compare" data-theme="propca-notion-style" lang="ko-KR" class="compare" data-marpit-pagination="15" style="--paginate:true;--header:02. 전용 레이아웃 — 콘텐츠 분할;--footer:© 2026 · procpa;--class:compare;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>02. 전용 레이아웃 — 콘텐츠 분할</header>

<h1 id="%EB%A0%88%EC%9D%B4%EC%95%84%EC%9B%83--compare">레이아웃 — compare</h1>
<p>클래스 <code>compare</code>는 도입 전후(Before vs After) 또는 상반되는 두 요소를 대칭 구조로 비교 대조하는 2단 레이아웃입니다.</p>
<div class="col">
<h3 id="%EA%B8%B0%EC%A1%B4-%EB%B0%A9%EC%8B%9D-before">기존 방식 (Before)</h3>
<ul>
<li>PowerPoint 프로그램을 켜고 수동 디자인 작업 수행</li>
<li>슬라이드 간 정렬, 폰트 종류, 여백이 뒤죽박죽으로 변형</li>
<li>내용 일부 수정 시 매번 PPT 레이아웃을 다시 정돈</li>
</ul>
</div>
<div class="vs">VS</div>
<div class="col">
<h3 id="%EB%85%B8%EC%85%98-%ED%85%8C%EB%A7%88-after">노션 테마 (After)</h3>
<ul>
<li>텍스트 중심으로 마크다운 파일만 가볍게 작성</li>
<li>정해진 Notion CSS 디자인 가이드라인으로 일관성 유지</li>
<li>수정 시 원본 텍스트만 고치면 디자인 자동 정돈</li>
</ul>
</div>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="02. 전용 레이아웃 — 콘텐츠 분할" data-footer="© 2026 · procpa" data-class="two-image" data-theme="propca-notion-style" lang="ko-KR" class="two-image" data-marpit-pagination="16" style="--paginate:true;--header:02. 전용 레이아웃 — 콘텐츠 분할;--footer:© 2026 · procpa;--class:two-image;--theme:propca-notion-style;" data-marpit-pagination-total="36">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="02. 전용 레이아웃 — 콘텐츠 분할" data-footer="© 2026 · procpa" data-class="before-after" data-theme="propca-notion-style" lang="ko-KR" class="before-after" data-marpit-pagination="17" style="--paginate:true;--header:02. 전용 레이아웃 — 콘텐츠 분할;--footer:© 2026 · procpa;--class:before-after;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>02. 전용 레이아웃 — 콘텐츠 분할</header>

<h1 id="%EB%A0%88%EC%9D%B4%EC%95%84%EC%9B%83--before-after">레이아웃 — before-after</h1>
<p>클래스 <code>before-after</code>는 이미지와 중간의 화살표 기호를 사용해 뚜렷한 시각적 개선 변화를 극대화하는 비교 슬라이드입니다.</p>
<div class="ba-row">
<div class="ba-col">
<h3 id="before">Before</h3>

<header>05. 전용 레이아웃 — 프로세스 / 리스트</header>

<h1 id="%EB%A0%88%EC%9D%B4%EC%95%84%EC%9B%83--timeline">레이아웃 — timeline</h1>
<p>클래스 <code>timeline</code>은 숫자 배지 사이를 연한 가로선이 흐르듯 연결하는 모던한 8단계 공정 흐름 슬라이드입니다.</p>
<ol>
<li><strong>분석 및 추출</strong> — 마크다운 내의 헤더 깊이 및 계층 구조 분석</li>
<li><strong>분절 및 매칭</strong> — 슬라이드 분할 규칙 및 적합한 레이아웃 선택</li>
<li><strong>Marp 변환</strong> — 컴포넌트 래핑용 <code>div</code> 구조 및 Marp 디렉티브 삽입</li>
<li><strong>산출물 검증</strong> — QA 에이전트를 통한 컴파일 결과물 최종 빌드</li>
<li><strong>스타일 튜닝</strong> — CSS 규칙 적용 및 세부 디자인 미세 조정</li>
<li><strong>피드백 수렴</strong> — 실시간 브라우저 프리뷰 및 유저 검토 진행</li>
<li><strong>최종 릴리즈</strong> — HTML 및 PDF 등 최종 산출물 포맷 내보내기</li>
<li><strong>유지 및 관리</strong> — 테마 템플릿 버전 업그레이드 및 버그 패치</li>
</ol>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="05. 전용 레이아웃 — 프로세스 / 리스트" data-footer="© 2026 · procpa" data-class="vertical-timeline" data-theme="propca-notion-style" lang="ko-KR" class="vertical-timeline" data-marpit-pagination="27" style="--paginate:true;--header:05. 전용 레이아웃 — 프로세스 / 리스트;--footer:© 2026 · procpa;--class:vertical-timeline;--theme:propca-notion-style;" data-marpit-pagination-total="36">

<p>클래스 <code>vertical-timeline</code>은 좌측 수직 레일을 따라 번호 순으로 공정이 계단식 진행되는 정교한 수직 타임라인 슬라이드입니다.</p>
<ol>
<li><strong>수집 단계</strong> — 원본 마크다운 구조 분석 및 메타데이터 정보 파악</li>
<li><strong>분절 단계</strong> — 슬라이드 한도 줄 수 검출 및 단락 쪼개기 작업</li>
<li><strong>매칭 단계</strong> — 카드, 차트, 타임라인 등 레이아웃 자동 판정</li>
<li><strong>빌드 단계</strong> — 설정된 테마 기반으로 웹 친화형 HTML/PDF 동시 빌드</li>
</ol>

<header>05. 전용 레이아웃 — 프로세스 / 리스트</header>

<h1 id="%EB%A0%88%EC%9D%B4%EC%95%84%EC%9B%83--toggle-list">레이아웃 — toggle-list</h1>
<p>클래스 <code>toggle-list</code>는 노션의 아코디언 토글 목록을 연상시키는 정갈한 계층형 텍스트 목록 레이아웃입니다.</p>
<div class="toggle heading">1단계 — 초기 환경 설정 및 계정 생성</div>
<div class="toggle item">회사 SSO 계정 활성화 및 2FA 연동 등록</div>
<div class="toggle item">로컬 개발 도구 설치 및 깃허브 SSH 인증 키 설정</div>
<div class="toggle heading">2단계 — 코드베이스 분석 및 첫 배포</div>
<div class="toggle item">개발 환경 빌드 스크립트 실행 및 데모 확인</div>
<div class="toggle item">스테이징 환경에 테스트 PR 업로드 및 머지 검증</div>
<footer>© 2026 · procpa</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="05. 전용 레이아웃 — 프로세스 / 리스트" data-footer="© 2026 · procpa" data-class="icon-list" data-theme="propca-notion-style" lang="ko-KR" class="icon-list" data-marpit-pagination="30" style="--paginate:true;--header:05. 전용 레이아웃 — 프로세스 / 리스트;--footer:© 2026 · procpa;--class:icon-list;--theme:propca-notion-style;" data-marpit-pagination-total="36">
<header>05. 전용 레이아웃 — 프로세스 / 리스트</header>

<h1 id="%EB%A0%88%EC%9D%B4%EC%95%84%EC%9B%83--icon-list">레이아웃 — icon-list</h1>
<p>클래스 <code>icon-list</code>는 강조 배지(Badge)와 카드가 깔끔하게 열 지어 늘어선 특징 나열용 레이아웃입니다.</p>
<ul>
<li><em>Fast</em> 실시간 Watch 모드 빌드를 지원하여 빠른 시각 피드백 제공</li>
<li><em>Safe</em> 기존 CSS와의 완벽한 하위 호환성을 제공하는 컴포넌트 탑재</li>
<li><em>Open</em> 별도의 외부 라이브러리 없이 Marp 코어 기능만으로 가볍게 빌드</li>
<li><em>Pretty</em> Notion 디자인 토큰 공유로 프레젠테이션 전체 톤앤매너 유지</li>
</ul>
<footer>© 2026 · procpa</footer>
</section>
