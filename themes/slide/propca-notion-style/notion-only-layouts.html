<h1 id="%ED%95%99%EC%8A%B5-%EB%AA%A9%ED%91%9C">학습 목표</h1>
<h2 id="objectives">OBJECTIVES</h2>
<ol>
<li><strong>독립성의 정의</strong>를 설명할 수 있다</li>
<li>독립성을 <strong>위협하는 요인</strong>을 식별할 수 있다</li>
<li>AI 검증 워크플로에서 <strong>독립성을 구현</strong>하는 방법을 안다</li>
</ol>
<footer>© 2026 · procpa.co.kr</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="propca-notion-style 전용 — procpa-vivid 미보유 레이아웃" data-footer="© 2026 · procpa.co.kr" data-class="lecture-definition" data-theme="propca-notion-style" lang="en-US" class="lecture-definition" data-marpit-pagination="4" style="--paginate:true;--header:propca-notion-style 전용 — procpa-vivid 미보유 레이아웃;--footer:© 2026 · procpa.co.kr;--class:lecture-definition;--theme:propca-notion-style;" data-marpit-pagination-total="17">
<header>propca-notion-style 전용 — procpa-vivid 미보유 레이아웃</header>

<h1 id="%ED%95%B5%EC%8B%AC-%EC%9A%A9%EC%96%B4">핵심 용어</h1>
<h2 id="definition">DEFINITION</h2>
<div class="def-body">감사 <strong>독립성(independence)</strong>이란 감사인이 피감사 기업과 어떠한 이해관계도 없이 직무를 수행할 수 있는 정신적·외형적 상태를 말한다.</div>
<div class="def-example">검증 에이전트는 작성 에이전트와 컨텍스트를 공유하지 않아, 합리화 편향 없이 결과를 교차 확인한다.</div>
<footer>© 2026 · procpa.co.kr</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="propca-notion-style 전용 — procpa-vivid 미보유 레이아웃" data-footer="© 2026 · procpa.co.kr" data-class="lecture-example" data-theme="propca-notion-style" lang="en-US" class="lecture-example" data-marpit-pagination="5" style="--paginate:true;--header:propca-notion-style 전용 — procpa-vivid 미보유 레이아웃;--footer:© 2026 · procpa.co.kr;--class:lecture-example;--theme:propca-notion-style;" data-marpit-pagination-total="17">
<header>propca-notion-style 전용 — procpa-vivid 미보유 레이아웃</header>

<h1 id="%EC%A0%81%EC%9A%A9-%EC%98%88%EC%A0%9C">적용 예제</h1>
<div class="steps">
<div><div class="num">Step 1</div><div class="body">작성 에이전트가 계정과목별 1차 조서를 생성</div></div>
<div><div class="num">Step 2</div><div class="body">독립 검증 에이전트가 이상치를 교차 점검</div></div>
<div><div class="num">Step 3</div><div class="body">사람은 최종 판단·서명만 수행</div></div>
</div>
<div class="result">독립성을 유지한 채 작업 시간을 약 40% 절감</div>
<footer>© 2026 · procpa.co.kr</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="propca-notion-style 전용 — procpa-vivid 미보유 레이아웃" data-footer="© 2026 · procpa.co.kr" data-class="lecture-quiz" data-theme="propca-notion-style" lang="en-US" class="lecture-quiz" data-marpit-pagination="6" style="--paginate:true;--header:propca-notion-style 전용 — procpa-vivid 미보유 레이아웃;--footer:© 2026 · procpa.co.kr;--class:lecture-quiz;--theme:propca-notion-style;" data-marpit-pagination-total="17">
<header>propca-notion-style 전용 — procpa-vivid 미보유 레이아웃</header>

<h1 id="%ED%99%95%EC%9D%B8-%ED%80%B4%EC%A6%88">확인 퀴즈</h1>
<h2 id="%EB%8B%A4%EC%9D%8C-%EC%A4%91-%EA%B0%90%EC%82%AC%EC%9D%B8%EC%9D%98-%EB%8F%85%EB%A6%BD%EC%84%B1%EC%9D%84-%EC%9C%84%ED%98%91%ED%95%98%EB%8A%94-%EC%83%81%ED%99%A9%EC%9D%80">다음 중 감사인의 독립성을 위협하는 상황은?</h2>
<div class="options">
<div data-opt="A">피감사 기업의 주식을 보유</div>
<div data-opt="B">표준 감사 절차서를 사용</div>
<div data-opt="C">독립 검증 에이전트를 운영</div>
<div data-opt="D">감사 조서를 문서화</div>
</div>
<div class="hint">힌트: <strong>이해관계</strong>의 존재 여부를 생각해보세요</div>
<footer>© 2026 · procpa.co.kr</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="propca-notion-style 전용 — procpa-vivid 미보유 레이아웃" data-footer="© 2026 · procpa.co.kr" data-class="lecture-takeaway" data-theme="propca-notion-style" lang="en-US" class="lecture-takeaway" data-marpit-pagination="7" style="--paginate:true;--header:propca-notion-style 전용 — procpa-vivid 미보유 레이아웃;--footer:© 2026 · procpa.co.kr;--class:lecture-takeaway;--theme:propca-notion-style;" data-marpit-pagination-total="17">

<blockquote>
<p>핵심은 도구가 아니라 <strong>제3자의 독립성</strong>이다. AI는 독립성을 구현하는 수단일 뿐이다.</p>
</blockquote>
<p>오늘의 핵심 정리</p>

<h1 id="%EC%B6%94%EC%A7%84-%EC%9D%BC%EC%A0%95--schedule">추진 일정 — schedule</h1>
<p>구체 날짜 기반 일정·마일스톤을 행 단위로 정리. 상태는 인라인 <code>.tag</code>와 조합.</p>
<table>
<thead>
<tr>
<th>날짜</th>
<th>일정</th>
<th>상태</th>
</tr>
</thead>
<tbody>
<tr>
<td>6/15(월)</td>
<td>업무 절차서 정비 킥오프</td>
<td><span class="tag green">완료</span></td>
</tr>
<tr>
<td>6/22(월)</td>
<td>스킬 변환 1차 검증</td>
<td><span class="tag yellow">진행중</span></td>
</tr>
<tr>
<td>7/06(월)</td>
<td>파일럿 팀 병행 운영 시작</td>
<td><span class="tag sky">예정</span></td>
</tr>
